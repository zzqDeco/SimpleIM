name: simpleim

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?HTTPS domain or site address is required}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:?Public hostname or IP for default_sni is required}
      GOMEMLIMIT: 48MiB
    ports:
      - "${PUBLIC_HTTPS_PORT:-8444}:${CADDY_HTTPS_PORT:-8444}"
      - "${PUBLIC_HTTPS_PORT:-8444}:${CADDY_HTTPS_PORT:-8444}/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CONFIG_FILE:-./tls/acme-domain.caddy}:/etc/caddy/issuer.caddy:ro
      - ${TLS_CERT_DIR:-./tls}:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - edge
      - private
    logging: *logging
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 15s

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    image: ${SERVER_IMAGE:-simpleim-server:latest}
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      SQLITE_PATH: /data/simpleim.sqlite
      SERVER_KEY_ID: ${SERVER_KEY_ID:-srvk_2026_01}
      SERVER_IDENTITY_PRIVATE_KEY: ${SERVER_IDENTITY_PRIVATE_KEY:?Ed25519 private signing key required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Comma-separated HTTPS origins required}
      STUN_URLS: ${STUN_URLS:-}
      COTURN_URLS: ${COTURN_URLS:-}
      COTURN_SHARED_SECRET: ${COTURN_SHARED_SECRET:-}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
    volumes:
      - server_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - private
    logging: *logging
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/healthz'); if (!r.ok) process.exit(1);",
        ]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: ${WEB_IMAGE:-simpleim-web:latest}
    restart: unless-stopped
    read_only: true
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    networks:
      - private
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 6

  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.6-alpine}
    profiles:
      - turn
    restart: unless-stopped
    network_mode: host
    read_only: true
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${COTURN_CONFIG_FILE:-./turnserver.conf.example}:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/tmp:size=4m,mode=1777
      - /var/lib/coturn:size=4m,mode=1777
      - /var/run:size=2m,mode=1777
    logging: *logging
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "3478"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 10s

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  server_data:
